name: "💡 Feature Request"
description: Suggest a new feature, workflow improvement, or enhancement for RUS PDF
title: "[Feature]: "
labels: ["needs-triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make RUS PDF better? We'd love to hear it!

  - type: dropdown
    id: area
    attributes:
      label: Target Component Area
      description: Which area does this feature relate to?
      options:
        - "area:pdf-editor (Canvas, page manipulation, text editing)"
        - "area:annotations (Drawings, highlights, stamps, shapes)"
        - "area:ocr (Text recognition, OCR language models)"
        - "area:digital-signature (Signing, certificate verification, LTV)"
        - "area:export-import (Batch convert, TXT export, saving/opening)"
        - "area:license (Activation, team licensing)"
        - "area:ui-ux (Layout, localization, themes, keyboard shortcuts)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Need
      description: Is your feature request related to a specific problem or friction in your workflow?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see.
      placeholder: "Add a button or workflow to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
